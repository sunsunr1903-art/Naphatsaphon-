
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>ติดต่อเรา</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <div class="brand">
      <img src="https://api.dicebear.com/7.x/initials/svg?seed=U" alt="profile">
    </div>
  </header>

  <section class="page-header">
    <h1>ติดต่อเรา</h1>
  </section>

  <form class="card" onsubmit="alert('ส่งข้อความเรียบร้อย (ตัวอย่างเท่านั้น)'); return false;">
    <label for="name">ชื่อของคุณ</label>
    <input type="text" id="name" placeholder="กรอกชื่อของคุณ" required>

    <label for="email">อีเมล</label>
    <input type="email" id="email" placeholder="กรอกอีเมล" required>

    <label for="message">ข้อความ</label>
    <textarea id="message" placeholder="พิมพ์ข้อความของคุณที่นี่" required></textarea>

    <button type="submit">ส่งข้อความ</button>
  </form>

</body>
</html>
