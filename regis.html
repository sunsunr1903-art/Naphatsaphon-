<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>ลงทะเบียน</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
  </header>

  <section class="page-header">
    <h1>ลงทะเบียน</h1>
  </section>

  <form class="card" onsubmit="alert('ลงทะเบียนเรียบร้อย (ตัวอย่างเท่านั้น)'); return false;">
    <label for="name">ชื่อ-นามสกุล</label>
    <input type="text" id="name" placeholder="กรอกชื่อ-นามสกุล" required>

    <label for="email">อีเมล</label>
    <input type="email" id="email" placeholder="กรอกอีเมล" required>

    <label for="password">รหัสผ่าน</label>
    <input type="password" id="password" placeholder="กรอกรหัสผ่าน" required>

    <button type="submit">ลงทะเบียน</button>
  </form>

</body>
</html>
