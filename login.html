<!DOCTYPE html>
<html lang="th">
<head>

<title>เข้าสู่ระบบ</title>

</head>
<body>

  <header class="navbar">
    <div class="brand">
      <img src="https://api.dicebear.com/7.x/initials/svg?seed=U" alt="profile">
    </div>

  <section class="page-header">
    <h1>เข้าสู่ระบบ</h1>

  <form class="card" onsubmit="alert('เข้าสู่ระบบเรียบร้อย (ตัวอย่างเท่านั้น)'); return false;">

    <input type="email" id="email" placeholder="กรอกอีเมล" required>

    <label for="password">รหัสผ่าน</label>
    <input type="password" id="password" placeholder="กรอกรหัสผ่าน" required>

    <button type="submit">เข้าสู่ระบบ</button>
  </form>

</body>
